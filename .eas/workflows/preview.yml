name: Preview (build de prueba en main)

# Cada push a main genera APKs de prueba (distribución interna) para Android
# móvil y Android TV, en paralelo. El enlace de instalación aparece en el run
# del workflow en expo.dev y como check en el commit de GitHub.
# Incluye [eas skip] en el mensaje del commit para saltarlo.
on:
  push:
    branches: ['main']

jobs:
  build_android:
    name: Build Android (preview)
    type: build
    params:
      platform: android
      profile: preview
      message: 'Preview móvil — ${{ github.sha }}'

  build_android_tv:
    name: Build Android TV (preview)
    type: build
    params:
      platform: android
      profile: preview-tv
      message: 'Preview TV — ${{ github.sha }}'
