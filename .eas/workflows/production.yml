name: Production

# Manual (no se dispara en cada push). Lánzalo desde expo.dev → Workflows, o con
# `eas workflow:run production.yml`. Genera los builds de producción para Android
# móvil y Android TV. Cuando tengas credenciales de tienda, añade jobs `submit`
# que dependan de estos builds.
on:
  workflow_dispatch: {}

jobs:
  build_android:
    name: Build Android (production)
    type: build
    params:
      platform: android
      profile: production
      message: 'Production móvil'

  build_android_tv:
    name: Build Android TV (production)
    type: build
    params:
      platform: android
      profile: production-tv
      message: 'Production TV'
