<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1" />
    <title>onevid</title>
    <!--
      App webOS de tipo "hosted": este stub solo redirige al sitio de onevid, que
      corre en el navegador del TV. Es una sonda de medicion (hito dev-mode): sirve
      para ver si el navegador del TV aguanta el stack web actual y como se porta el
      mando. NO es el producto final (la SPA empaquetada viene en el hito MVP).

      La URL destino se fija por el valor de ONEVID_TV_URL mas abajo; cambiala si
      quieres apuntar a una ruta dedicada de TV en vez de la home.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #fff;
        font-family: system-ui, sans-serif;
      }
      .loading {
        display: flex;
        height: 100%;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        letter-spacing: 0.05em;
      }
    </style>
  </head>
  <body>
    <div class="loading">onevid</div>
    <script>
      // Origen destino. El TV abre esta web en su navegador; al ser el mismo
      // origen del backend, la sesion por cookies/SSO del escritorio aplica.
      var ONEVID_TV_URL = "https://onevid.hackw.tech";
      // location.replace evita que el stub quede en el historial del TV, para que
      // el boton "atras" del mando no vuelva a esta pantalla en blanco.
      window.location.replace(ONEVID_TV_URL);
    </script>
    <noscript>
      <meta http-equiv="refresh" content="0; url=https://onevid.hackw.tech" />
    </noscript>
  </body>
</html>
